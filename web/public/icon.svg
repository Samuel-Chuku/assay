<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The window, which is the whole layout system of the site reduced to 32px:
    ink border, cream interior, a title bar with its two circles. At tab size
    the wordmark would be unreadable, so the chrome carries the identity.
  -->
  <rect x="2" y="3" width="28" height="26" rx="4" fill="#1A1A1A"/>
  <rect x="4" y="5" width="24" height="22" rx="3" fill="#FBF8F0"/>
  <rect x="4" y="5" width="24" height="7" fill="#1A1A1A"/>
  <circle cx="22" cy="8.5" r="1.3" fill="#FBF8F0"/>
  <circle cx="25.5" cy="8.5" r="1.3" fill="#FBF8F0"/>
  <rect x="7" y="16" width="14" height="2.6" rx="1.3" fill="#0B7FBF"/>
  <rect x="7" y="21" width="9" height="2.6" rx="1.3" fill="#A39B8C"/>
</svg>
